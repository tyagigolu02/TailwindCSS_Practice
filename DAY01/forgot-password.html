<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailwindCSS - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'glass-white': 'rgba(255, 255, 255, 0.25)',
                        'glass-border': 'rgba(255, 255, 255, 0.18)',
                        'text-primary': '#2d3748',
                        'text-secondary': '#4a5568',
                        'accent-blue': '#4299e1',
                        'accent-purple': '#9f7aea',
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 min-h-screen flex items-center justify-center p-4">
    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-orange-500 to-red-500 rounded-full mb-4">
                <i class="fa-solid fa-key text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Reset Password</h1>
            <p class="text-gray-600">Enter your email to receive a reset link</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white/70 backdrop-blur-md border border-white/20 rounded-2xl shadow-xl p-8 fade-in">
            <form action="" class="space-y-5" id="forgotPasswordForm">
                <!-- Email Input -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Email Address</label>
                    <div class="relative">
                        <div class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fa-solid fa-envelope text-sm"></i>
                        </div>
                        <input type="email" name="email" placeholder="Enter your email address" required 
                               class="w-full bg-white/50 border border-gray-200 py-3 pl-10 pr-4 rounded-xl text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all duration-300">
                    </div>
                </div>

                <!-- Reset Button -->
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-semibold py-3 rounded-xl hover:from-orange-600 hover:to-red-600 transform hover:scale-[1.02] transition-all duration-300 shadow-lg hover:shadow-xl">
                    Send Reset Link
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 space-y-3">
            <p class="text-gray-600">
                Remember your password? 
                <a href="01.html" class="text-blue-600 hover:text-blue-800 font-semibold underline">Sign in</a>
            </p>
            <p class="text-gray-600">
                Don't have an account? 
                <a href="signup.html" class="text-blue-600 hover:text-blue-800 font-semibold underline">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-8 text-center">
            <div class="mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-4">
                    <i class="fa-solid fa-envelope-circle-check text-3xl text-green-600"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Reset Link Sent!</h2>
                <p class="text-gray-600">We've sent a password reset link to your email address. Please check your inbox.</p>
            </div>
            <button onclick="closeModal()" 
                    class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-semibold py-3 rounded-xl hover:from-orange-600 hover:to-red-600 transition-all duration-300">
                Close
            </button>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const email = formData.get('email');
            
            // Simulate API call
            setTimeout(() => {
                // Store reset request (for demo purposes)
                const resetData = {
                    email: email,
                    resetToken: Math.random().toString(36).substring(2, 15),
                    requestedAt: new Date().toISOString()
                };
                
                localStorage.setItem('passwordReset', JSON.stringify(resetData));
                document.getElementById('successModal').classList.remove('hidden');
            }, 1500);
        });
        
        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
        }
    </script>
</body>
</html>
